<script>
// Shared by the person legend and the tag chips: a tile shows only if it matches both.
if (!window.applyGalleryFilter) {
  window.galleryFilter = {by: '*', tag: '*'};
  window.applyGalleryFilter = () => {
    const {by, tag} = window.galleryFilter;
    document.querySelectorAll('.it[data-by]').forEach(t => t.classList.toggle('hid',
      (by !== '*' && t.dataset.by !== by) || (tag !== '*' && !('|' + (t.dataset.tags || '') + '|').includes('|' + tag + '|'))));
    document.querySelectorAll('.grid').forEach(g => { const empty = !g.querySelector('.it:not(.hid)');
      g.style.display = empty ? 'none' : ''; const d = g.previousElementSibling; if (d && d.classList.contains('day')) d.style.display = empty ? 'none' : ''; });
  };
}
</script>
