{% extends "base.html" %}{% block title %}Admin login{% endblock %}{% block body %}
<div class="card" style="max-width:360px;margin:80px auto">
<h1 style="margin-bottom:16px">Admin</h1>
{% if not configured %}<p style="color:var(--bad)">ADMIN_PASSWORD isn't set. Set it in .env and restart.</p>{% endif %}
{% if error %}<p style="color:var(--bad)">{{ error }}</p>{% endif %}
<form method="post" class="row"><input type="password" name="password" placeholder="Password" autofocus required style="flex:1"><button>Log in</button></form>
</div>{% endblock %}
