<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<style>
:root{--bg:#0f0f10;--card:#1a1a1c;--fg:#f2f2f2;--mut:#9a9aa0;--acc:#4f8cff;--bad:#e5484d}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:26px;margin:0}h2{font-size:18px;margin:24px 0 10px}
.mut{color:var(--mut)}
.btn,button{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
.btn.sec,button.sec{background:#2a2a2e}.btn.bad,button.bad{background:var(--bad)}
input[type=text],input[type=password]{background:#222226;border:1px solid #333;color:var(--fg);border-radius:8px;padding:9px 12px;font:inherit}
.card{background:var(--card);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.grid .it{position:relative;aspect-ratio:1;background:#222;border-radius:8px;overflow:hidden;cursor:pointer}
.grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block}
.grid .vid::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#fff;text-shadow:0 0 8px #000}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid #2a2a2e;text-align:left}
code{background:#222226;padding:2px 6px;border-radius:5px;word-break:break-all}
textarea,select,input[type=date]{background:#222226;border:1px solid #333;color:var(--fg);border-radius:8px;padding:9px 12px;font:inherit}
.it .chk{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:none}
.selecting .it .chk{display:block}.it.sel .chk{background:var(--acc);border-color:var(--acc)}
.it.sel .chk::after{content:"✓";color:#fff;display:grid;place-items:center;height:100%;font-size:14px}
.it.sel img,.it.sel video{opacity:.75}
.bar{height:6px;background:#2a2a2e;border-radius:3px;overflow:hidden;margin-top:8px}.bar>div{height:100%;width:0;background:var(--acc);transition:width .2s}
.ok{color:#46a758}
.it .byb{position:absolute;inset:0;border:3px solid var(--c);border-radius:inherit;pointer-events:none}
.it.hid{display:none}
.legend{margin:6px 0 4px}.chip{background:#1f1f22;border:1px solid #333;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--fg)}
.chip.on{border-color:var(--acc);background:#22324d}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
@media (max-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:3px}.grid .it{border-radius:3px}.wrap{padding:12px}h1{font-size:22px}}
</style>{% block head %}{% endblock %}
</head><body><div class="wrap">{% block body %}{% endblock %}</div></body></html>
