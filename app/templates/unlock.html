{% extends "base.html" %}{% block title %}{{ ev.name }}{% endblock %}{% block head %}<meta name="robots" content="noindex">{% endblock %}{% block body %}
<div class="card" style="max-width:380px;margin:80px auto;text-align:center">
<h1>{{ ev.name }}</h1><p class="mut">This album is password protected.</p>
{% if error %}<p style="color:var(--bad)">{{ error }}</p>{% endif %}
<form method="post" action="/e/{{ ev.token }}/unlock" class="row" style="justify-content:center">
<input type="password" name="password" placeholder="Password" autofocus required style="flex:1"><button>Open</button></form></div>
{% endblock %}
